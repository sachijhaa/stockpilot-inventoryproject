worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:4000;
    }

    upstream ai_upstream {
        server ai-service:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # Backend REST API
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded files served by the backend (product images, invoices)
        location /uploads/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Swagger API docs
        location /api-docs/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
        }

        # Socket.io realtime (WebSocket upgrade)
        location /socket.io/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # AI microservice (proxied directly for docs/debugging; normally
        # accessed server-to-server by the backend, not the browser)
        location /ai-service/ {
            rewrite ^/ai-service/(.*)$ /$1 break;
            proxy_pass http://ai_upstream;
            proxy_set_header Host $host;
        }

        # Everything else -> React SPA
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
